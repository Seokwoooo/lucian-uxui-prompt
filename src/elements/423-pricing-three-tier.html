<style>
.u423{position:relative;width:340px;height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--ux-ink)}
/* 월간·연간 토글: 손잡이가 스프링으로 미끄러집니다 */
.u423-seg{position:relative;display:flex;padding:3px;border-radius:99px;background:var(--ux-surface-2);box-shadow:inset 0 0 0 1px var(--ux-line)}
.u423-th{position:absolute;left:3px;top:3px;bottom:3px;width:calc(50% - 3px);border-radius:99px;background:var(--ux-surface);box-shadow:0 0 0 1px var(--ux-line),0 1px 2px var(--ux-shadow),0 4px 10px -4px var(--ux-shadow);transition:transform .55s cubic-bezier(.3,1.5,.5,1)}
.u423.is-y .u423-th{transform:translateX(100%)}
.u423-opt{position:relative;z-index:1;width:84px;height:28px;border:0;border-radius:99px;background:none;font-size:12.5px;font-weight:650;color:var(--ux-ink-3);transition:color .25s}
.u423-opt[aria-checked="true"]{color:var(--ux-ink)}
.u423-opt:hover{color:var(--ux-ink-2)}
.u423-opt[aria-checked="true"]:hover{color:var(--ux-ink)}
.u423-opt:focus-visible{outline:2px solid var(--ux-accent);outline-offset:2px}
/* 카드 */
.u423-card{width:256px;padding:16px 18px 16px;border-radius:20px;background:var(--ux-surface);box-shadow:0 0 0 1px var(--ux-line),0 1px 2px var(--ux-shadow),0 16px 32px -20px var(--ux-shadow-strong);transition:transform .5s var(--ux-spring),box-shadow .4s var(--ux-ease)}
.u423-card:hover{transform:translateY(-4px);box-shadow:0 0 0 1px var(--ux-line-2),0 2px 4px var(--ux-shadow),0 26px 44px -22px var(--ux-shadow-strong)}
.u423-hd{display:flex;align-items:center;justify-content:space-between;height:22px}
.u423-hd b{font-size:14px;font-weight:800;letter-spacing:-.02em}
.u423-bd{display:flex;align-items:center;height:22px;padding:0 9px;border-radius:99px;background:color-mix(in srgb,var(--ux-mint) 15%,transparent);color:var(--ux-mint);font-size:10.5px;font-weight:800;white-space:nowrap;opacity:0;transform:scale(.4) translateY(4px);transition:opacity .15s,transform .25s var(--ux-ease)}
.u423.is-y .u423-bd{opacity:1;transform:none;transition:opacity .2s .12s,transform .55s cubic-bezier(.3,1.8,.5,1) .12s}
/* 가격: 자리마다 0~9가 세로로 쌓여 있고, 바뀐 자리만 굴러갑니다 */
.u423-pr{display:flex;align-items:flex-end;gap:4px;margin-top:6px}
.u423-num{display:flex;font-size:32px;line-height:38px;height:38px;font-weight:850;letter-spacing:-.03em;font-variant-numeric:tabular-nums;overflow:hidden}
.u423-num i{font-style:normal}
.u423-col{display:block;height:38px;overflow:hidden}
.u423-col span{display:flex;flex-direction:column;transform:translateY(calc(var(--d,0) * -38px));transition:transform .7s cubic-bezier(.3,1.25,.45,1);transition-delay:calc(var(--k,0) * 45ms)}
.u423-col span b{display:block;height:38px;font-weight:inherit;text-align:center}
.u423-per{margin-bottom:6px;font-size:12px;font-weight:650;color:var(--ux-ink-3)}
.u423-sub{position:relative;height:16px;margin-top:2px;font-size:11px;color:var(--ux-ink-3)}
.u423-sub span{position:absolute;left:0;top:0;white-space:nowrap;transition:opacity .3s var(--ux-ease),transform .45s var(--ux-ease),filter .3s}
.u423-sub span:last-child,.u423.is-y .u423-sub span:first-child{opacity:0;transform:translateY(6px);filter:blur(2px)}
.u423.is-y .u423-sub span:first-child{transform:translateY(-6px)}
.u423.is-y .u423-sub span:last-child{opacity:1;transform:none;filter:none}
.u423-ls{margin:12px 0 0;padding:12px 0 0;border-top:1px solid var(--ux-line);list-style:none;display:grid;gap:7px}
.u423-ls li{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:550;color:var(--ux-ink-2)}
.u423-ls svg{width:14px;height:14px;flex:none;fill:none;stroke:var(--ux-accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.u423-go{width:100%;height:36px;margin-top:14px;border:0;border-radius:11px;background:var(--ux-ink);color:var(--ux-surface);font-size:12.5px;font-weight:750;transition:transform .35s var(--ux-spring),opacity .15s}
.u423-go:hover{opacity:.9}
.u423-go:active{transform:scale(.96)}
.u423-go:focus-visible{outline:2px solid var(--ux-accent);outline-offset:2px}
.u423-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.u423-th,.u423-bd,.u423-col span,.u423-sub span,.u423-card{transition:none!important}}
</style>
<div class="ux u423">
  <div class="u423-seg" role="radiogroup" aria-label="결제 주기">
    <span class="u423-th" aria-hidden="true"></span>
    <button class="u423-opt" type="button" role="radio" aria-checked="true">월간</button>
    <button class="u423-opt" type="button" role="radio" aria-checked="false" tabindex="-1">연간</button>
  </div>
  <div class="u423-card">
    <div class="u423-hd"><b>Pro</b><span class="u423-bd">2개월 무료</span></div>
    <div class="u423-pr"><span class="u423-num" aria-hidden="true"></span><span class="u423-per">/월</span><span class="u423-sr" aria-live="polite"></span></div>
    <div class="u423-sub"><span>매월 결제</span><span>연 ₩150,000 한 번에 결제</span></div>
    <ul class="u423-ls">
      <li><svg viewBox="0 0 14 14" aria-hidden="true"><path d="m3.2 7.4 2.5 2.5 5.1-5.6"/></svg>멤버 20명까지</li>
      <li><svg viewBox="0 0 14 14" aria-hidden="true"><path d="m3.2 7.4 2.5 2.5 5.1-5.6"/></svg>AI 회의록 무제한</li>
      <li><svg viewBox="0 0 14 14" aria-hidden="true"><path d="m3.2 7.4 2.5 2.5 5.1-5.6"/></svg>자동화 월 1,000회</li>
    </ul>
    <button class="u423-go" type="button">Pro 시작하기</button>
  </div>
</div>
<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var opts = Array.prototype.slice.call(root.querySelectorAll('.u423-opt'));
  var num = root.querySelector('.u423-num'), sr = root.querySelector('.u423-sr');
  var PRICE = [15000, 12500], yearly = false, cols = [];
  // ₩와 쉼표는 그대로 두고, 숫자 자리마다 0~9 띠를 만듭니다
  function build(txt) {
    num.innerHTML = '';
    cols = [];
    var k = 0;
    txt.split('').forEach(function (ch) {
      if (!/\d/.test(ch)) { var i = document.createElement('i'); i.textContent = ch; num.appendChild(i); return; }
      var c = document.createElement('span');
      c.className = 'u423-col';
      c.innerHTML = '<span>' + '0123456789'.split('').map(function (d) { return '<b>' + d + '</b>'; }).join('') + '</span>';
      c.firstChild.style.setProperty('--k', k++);
      num.appendChild(c);
      cols.push(c.firstChild);
    });
  }
  function fmt(v) { return '₩' + String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function show(v) {
    var digits = String(v).split('');
    cols.forEach(function (c, i) { c.style.setProperty('--d', digits[i]); });
    sr.textContent = '월 ' + v.toLocaleString('ko-KR') + '원';
  }
  function set(y, focus) {
    if (y === yearly) return;
    yearly = y;
    root.classList.toggle('is-y', y);
    opts.forEach(function (b, i) { var on = (i === 1) === y; b.setAttribute('aria-checked', String(on)); b.tabIndex = on ? 0 : -1; });
    show(PRICE[y ? 1 : 0]);
    if (focus) opts[y ? 1 : 0].focus({ preventScroll: true });
  }
  opts.forEach(function (b, i) {
    b.addEventListener('click', function () { set(i === 1); });
    b.addEventListener('keydown', function (e) {
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].indexOf(e.key) < 0) return;
      e.preventDefault(); set(!yearly, true);
    });
  });
  // 처음 값은 굴리지 않고 바로 놓습니다
  build(fmt(PRICE[0]));
  cols.forEach(function (c) { c.style.transition = 'none'; });
  show(PRICE[0]);
  void num.offsetWidth;
  cols.forEach(function (c) { c.style.transition = ''; });
})();
</script>
