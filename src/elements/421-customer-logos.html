<style>

</style>

</section>
<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var mq = root.querySelector('.u421-mq'), tr = root.querySelector('.u421-tr');
  var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var M = 'fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"';
  // 가상의 고객사 워드마크
  var LOGOS = [
    ['Velora', '<circle cx="9" cy="9" r="7" ' + M + '/><path d="M5.5 6.5 9 12l3.5-5.5" ' + M + '/>'],
    ['NORTHPINE', '<path d="M9 2.5 15 14H3z" fill="currentColor"/><path d="M9 14v2.5" ' + M + '/>'],
    ['paperkite', '<path d="M9 2 15 8l-6 8-6-8z" ' + M + '/><path d="M3 8h12M9 2v14" ' + M + ' stroke-width="1.2"/>'],
    ['Orbita', '<circle cx="9" cy="9" r="6.5" ' + M + '/><circle cx="13.6" cy="4.4" r="2" fill="currentColor"/>'],
    ['Mintleaf', '<path d="M3.5 14.5C3.5 7 8 3.5 14.5 3.5 14.5 10 11 14.5 3.5 14.5z" ' + M + '/><path d="M3.5 14.5 10 8" ' + M + '/>'],
    ['TESSEL', '<rect x="2.5" y="2.5" width="5.5" height="5.5" rx="1" fill="currentColor"/><rect x="10" y="2.5" width="5.5" height="5.5" rx="1" ' + M + '/><rect x="2.5" y="10" width="5.5" height="5.5" rx="1" ' + M + '/><rect x="10" y="10" width="5.5" height="5.5" rx="1" fill="currentColor"/>'],
    ['Kestrel', '<path d="M2 12c3-1 5-3.5 7-8 2 4.5 4 7 7 8-3 .2-5 1.3-7 3-2-1.7-4-2.8-7-3z" fill="currentColor"/>'],
    ['Brightwell', '<path d="M3 12.5a6 6 0 0 1 12 0" ' + M + '/><path d="M9 3v2M3.6 5.6 5 7M14.4 5.6 13 7M1.5 15.5h15" ' + M + '/>']
  ];
  function list(hide) { return '<ul' + (hide ? ' aria-hidden="true"' : ' aria-label="고객사"') + '>' + LOGOS.map(function (l, i) { return '<li class="u421-lg w' + (i + 1) + '"><svg viewBox="0 0 18 18" aria-hidden="true">' + l[1] + '</svg><span>' + l[0] + '</span></li>'; }).join('') + '</ul>'; }
  tr.innerHTML = list(false) + list(true);
  // 속도를 목표값으로 부드럽게 맞춰, 포인터를 올리면 미끄러지듯 멈춥니다
  var x = 0, v = 26, target = 26, last = 0, half = 0;
  mq.addEventListener('pointerenter', function () { target = 0; });
  mq.addEventListener('pointerleave', function () { target = 26; });
  function frame(now) {
    if (!root.isConnected) return;
    var dt = last ? Math.min(.05, (now - last) / 1000) : 0;
    last = now;
    if (!half) half = tr.firstChild.offsetWidth;
    v += (target - v) * Math.min(1, dt * 3.2);
    x -= v * dt;
    if (half && x <= -half) x += half;
    tr.style.transform = 'translate3d(' + x.toFixed(2) + 'px,0,0)';
    requestAnimationFrame(frame);
  }
  if (!rm) requestAnimationFrame(frame);
})();
</script>
