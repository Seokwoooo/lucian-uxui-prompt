<style>

<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var mq = root.querySelector('.u421-mq'), gr = root.querySelector('.u421-gr');
  var seg = Array.prototype.slice.call(root.querySelectorAll('.u421-seg button'));
  // 가상의 고객사 워드마크: [이름, 모양]
  var M = 'fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"';
  var LOGOS = [
    ['Velora', '<circle cx="9" cy="9" r="7" ' + M + '/><path d="M5.5 6.5 9 12l3.5-5.5" ' + M + '/>'],
    ['NORTHPINE', '<path d="M9 2.5 15 14H3z" fill="currentColor"/><path d="M9 14v2.5" ' + M + '/>'],
    ['paperkite', '<path d="M9 2 15 8l-6 8-6-8z" ' + M + '/><path d="M3 8h12M9 2v14" ' + M + ' stroke-width="1.2"/>'],
    ['Orbita', '<circle cx="9" cy="9" r="6.5" ' + M + '/><circle cx="13.6" cy="4.4" r="2" fill="currentColor"/>'],
    ['Mintleaf', '<path d="M3.5 14.5C3.5 7 8 3.5 14.5 3.5 14.5 10 11 14.5 3.5 14.5z" ' + M + '/><path d="M3.5 14.5 10 8" ' + M + '/>'],
    ['TESSEL', '<rect x="2.5" y="2.5" width="5.5" height="5.5" rx="1" fill="currentColor"/><rect x="10" y="2.5" width="5.5" height="5.5" rx="1" ' + M + '/><rect x="2.5" y="10" width="5.5" height="5.5" rx="1" ' + M + '/><rect x="10" y="10" width="5.5" height="5.5" rx="1" fill="currentColor"/>'],
    ['Kestrel', '<path d="M2 12c3-1 5-3.5 7-8 2 4.5 4 7 7 8-3 .2-5 1.3-7 3-2-1.7-4-2.8-7-3z" fill="currentColor"/>'],
    ['Brightwell', '<path d="M3 12.5a6 6 0 0 1 12 0" ' + M + '/><path d="M9 3v2M3.6 5.6 5 7M14.4 5.6 13 7M1.5 15.5h15" ' + M + '/>']
  ];
  function logo(l, i) { return '<span class="u421-lg w' + (i + 1) + '"><svg viewBox="0 0 18 18" aria-hidden="true">' + l[1] + '</svg><span>' + l[0] + '</span></span>'; }
  function list(order, hide) { return '<ul' + (hide ? ' aria-hidden="true"' : '') + '>' + order.map(function (i) { return '<li>' + logo(LOGOS[i], i) + '</li>'; }).join('') + '</ul>'; }
  var A = [0, 1, 2, 3, 4, 5, 6, 7], B = [4, 6, 0, 7, 2, 5, 1, 3];
  // 두 줄이 서로 반대로 흐릅니다. 두 번째 사본은 화면 읽기 프로그램에서 숨깁니다
  mq.innerHTML = '<div class="u421-row">' + list(A) + list(A, true) + '</div><div class="u421-row r2" aria-hidden="true">' + list(B, true) + list(B, true) + '</div>';
  mq.querySelector('ul').setAttribute('aria-label', gr.getAttribute('aria-label'));
  gr.innerHTML = A.map(function (i) { return '<li class="u421-cell">' + logo(LOGOS[i], i) + '</li>'; }).join('');
  function set(g, focus) {
    root.classList.toggle('is-grid', g);
    mq.hidden = g; gr.hidden = !g;
    seg.forEach(function (b, i) { var on = (i === 1) === g; b.setAttribute('aria-checked', String(on)); b.tabIndex = on ? 0 : -1; });
    if (focus) seg[g ? 1 : 0].focus({ preventScroll: true });
  }
  seg.forEach(function (b, i) {
    b.addEventListener('click', function () { set(i === 1); });
    b.addEventListener('keydown', function (e) {
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].indexOf(e.key) < 0) return;
      e.preventDefault(); set(!root.classList.contains('is-grid'), true);
    });
  });
  root.querySelector('.u421-ft').addEventListener('click', function (e) { e.preventDefault(); });
})();
</script>
