<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var card = root.querySelector('.u461-card'), stub = root.querySelector('.u461-stub'), live = root.querySelector('.u461-live');
  var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var T = { torn: '좌석 쪽지를 뜯었어요', back: '좌석 쪽지를 다시 붙였어요' };
  // 바코드: 고정된 패턴으로 막대를 그립니다
  (function () {
    var svg = root.querySelector('.u461-bc'), x = 0, s = 7, out = '';
    while (x < 57) { s = (s * 37 + 11) % 101; var w = s % 3 === 0 ? 2.2 : s % 5 === 0 ? 1.6 : 1; if (x + w > 58) break; out += '<rect x="' + x.toFixed(1) + '" y="0" width="' + w + '" height="30"/>'; x += w + (s % 2 ? 1.4 : 2); }
    svg.innerHTML = out;
  })();
  // 스프링 하나: v(현재) → t(목표), s(속도)
  function S() { return { v: 0, t: 0, s: 0 }; }
  var rx = S(), ry = S(), nx = S(), ny = S(), hot = S(), cx = S(), sx = S(), sy = S(), sr = S();
  var tilt = [rx, ry, nx, ny, hot], body = [cx], piece = [sx, sy, sr];
  var torn = false, drag = null, moved = false, raf = 0, fast = false;
  var REST = { x: 14, y: 16, r: -4, cx: -9 };
  function step(p, k, c, dt) { var a = k * (p.t - p.v) - c * p.s; p.s += a * dt; p.v += p.s * dt; }
  function still(list) { return list.every(function (p) { return Math.abs(p.t - p.v) < 0.01 && Math.abs(p.s) < 0.02; }); }
  function paint() {
    card.style.setProperty('--u461-rx', rx.v.toFixed(3));
    card.style.setProperty('--u461-ry', ry.v.toFixed(3));
    card.style.setProperty('--u461-nx', nx.v.toFixed(4));
    card.style.setProperty('--u461-ny', ny.v.toFixed(4));
    card.style.setProperty('--u461-hot', Math.max(0, Math.min(1, hot.v)).toFixed(3));
    card.style.setProperty('--u461-cx', cx.v.toFixed(2));
    stub.style.setProperty('--u461-sx', sx.v.toFixed(2) + 'px');
    stub.style.setProperty('--u461-sy', sy.v.toFixed(2) + 'px');
    stub.style.setProperty('--u461-sr', sr.v.toFixed(3) + 'deg');
  }
  function frame() {
    raf = 0;
    if (!root.isConnected) return;
    for (var i = 0; i < 4; i++) {
      tilt.forEach(function (p) { step(p, 110, 15, 1 / 240); });
      body.forEach(function (p) { step(p, 170, 13, 1 / 240); });
      piece.forEach(function (p) { if (drag && fast) step(p, 1400, 62, 1 / 240); else step(p, 240, 14, 1 / 240); });
    }
    paint();
    if (!(still(tilt) && still(body) && still(piece))) raf = requestAnimationFrame(frame);
  }
  function kick() {
    if (rm) { tilt.concat(body, piece).forEach(function (p) { p.v = p.t; p.s = 0; }); rx.v = ry.v = 0; paint(); return; }
    if (!raf) raf = requestAnimationFrame(frame);
  }
  // 커서 위치로 카드를 기울입니다. 쪽지를 잡고 있을 때는 기울기를 줄여 찢는 손짓이 잘 보이게 합니다
  root.addEventListener('pointermove', function (e) {
    var r = card.getBoundingClientRect();
    if (!r.width) return;
    var x = Math.max(-1, Math.min(1, (e.clientX - (r.left + r.width / 2)) / (r.width / 2)));
    var y = Math.max(-1, Math.min(1, (e.clientY - (r.top + r.height / 2)) / (r.height / 2)));
    var g = drag ? 0.3 : 1;
    rx.t = -y * 9 * g; ry.t = x * 12 * g; nx.t = x; ny.t = y; hot.t = 1;
    kick();
  });
  root.addEventListener('pointerleave', function () { rx.t = ry.t = nx.t = ny.t = hot.t = 0; kick(); });
  function say(s) { live.textContent = s; }
  function setTorn(on, quiet) {
    torn = on;
    root.classList.toggle('is-torn', on);
    stub.setAttribute('aria-pressed', String(on));
    sx.t = on ? REST.x : 0; sy.t = on ? REST.y : 0; sr.t = on ? REST.r : 0; cx.t = on ? REST.cx : 0;
    if (!quiet) say(on ? T.torn : T.back);
  }
  stub.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    var r = root.getBoundingClientRect();
    drag = { x: e.clientX, y: e.clientY, k: root.offsetWidth / (r.width || 1), bx: sx.v, by: sy.v, free: torn, was: torn };
    moved = false; fast = true;
    try { stub.setPointerCapture(e.pointerId); } catch (er) { /* 무시 */ }
    stub.classList.add('is-hold');
    rx.t *= 0.3; ry.t *= 0.3;
    kick();
  });
  stub.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var dx = (e.clientX - drag.x) * drag.k, dy = (e.clientY - drag.y) * drag.k;
    if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
    if (!drag.free) {
      // 붙어 있는 동안: 아래 모서리를 축으로 위쪽부터 벌어지며, 당길수록 버팁니다
      var pull = Math.max(0, dx * 0.8 + dy * 0.6);
      if (pull > 50) {
        drag.free = true; fast = false;
        cx.s -= 60;
        say(T.torn);
      } else {
        sx.t = Math.max(-3, dx * 0.1); sy.t = dy * 0.06; sr.t = Math.min(14, pull * 0.24);
      }
    }
    if (drag.free) { sx.t = drag.bx + dx; sy.t = drag.by + dy; sr.t = (drag.was ? REST.r : 4) + dx * 0.03; if (!drag.was) cx.t = REST.cx; }
    kick();
  });
  function up() {
    if (!drag) return;
    var d = drag;
    drag = null; fast = false;
    stub.classList.remove('is-hold');
    if (!d.free) setTorn(false, true);
    else if (d.was && Math.hypot(sx.t, sy.t) < 34) setTorn(false);
    else setTorn(true, true);
    kick();
  }
  stub.addEventListener('pointerup', up);
  stub.addEventListener('pointercancel', up);
  // 클릭(또는 Enter·Space)은 뜯기와 다시 붙이기를 오갑니다
  stub.addEventListener('click', function () {
    if (moved) { moved = false; return; }
    if (!torn) { sr.s += 120; cx.s -= 50; }
    setTorn(!torn);
    kick();
  });
  paint();
})();
</script>
