<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var q = function (s) { return root.querySelector(s); };
  var all = q('.u433-all'), kids = root.querySelectorAll('.u433-ch'), ct = q('.u433-ct'), sv = q('.u433-sv'), svT = q('.u433-sv span'), push = q('.u433-push'), quiet = q('.u433-quiet'), dnd = q('.u433-dnd');
  var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var T = { saved: '저장됨', saving: '저장 중…', count: '{a}/{b}개 켜짐', needPush: '푸시 알림을 켜면 쓸 수 있어요' };
  var uid = 'u433' + Math.random().toString(36).slice(2, 7);
  var dndText = dnd.textContent;
  // 라벨 연결: 그룹 제목과 설명 문구에 고유 id를 붙입니다
  ['1', '2', '3'].forEach(function (n) {
    var h = q('.u433-h' + n), g = h.parentNode;
    h.id = uid + 'h' + n; g.setAttribute('aria-labelledby', h.id);
  });
  root.querySelectorAll('.u433-row').forEach(function (row, i) {
    var inp = row.querySelector('input'), sm = row.querySelector('small');
    if (sm) { sm.id = uid + 'd' + i; inp.setAttribute('aria-describedby', sm.id); }
  });
  root.querySelectorAll('input[type="radio"]').forEach(function (r) { r.name = uid + 'freq'; });
  function enabledKids() { return Array.prototype.filter.call(kids, function (k) { return !k.disabled; }); }
  // 켤 수 있는 하위 항목이 모두 켜지면 체크, 일부면 ‘일부 선택’, 하나도 없으면 빈 칸
  function syncAll() {
    var en = enabledKids(), on = en.filter(function (k) { return k.checked; }).length;
    all.checked = on === en.length;
    all.indeterminate = on > 0 && on < en.length;
    var total = kids.length, onAll = Array.prototype.filter.call(kids, function (k) { return k.checked; }).length;
    ct.textContent = T.count.replace('{a}', onAll).replace('{b}', total);
  }
  function syncPush() {
    var off = !push.checked;
    quiet.disabled = off;
    quiet.closest('.u433-row').classList.toggle('is-off', off);
    dnd.textContent = off ? T.needPush : dndText;
  }
  var saveT = 0;
  function saved() {
    sv.classList.add('is-busy');
    svT.textContent = T.saving;
    clearTimeout(saveT);
    saveT = setTimeout(function () {
      if (!root.isConnected) return;
      sv.classList.remove('is-busy');
      svT.textContent = T.saved;
    }, rm ? 200 : 650);
  }
  all.addEventListener('change', function () {
    // ‘일부 선택’이나 빈 칸에서 누르면 모두 켜고, 모두 켜져 있으면 모두 끕니다
    var en = enabledKids(), every = en.every(function (k) { return k.checked; });
    en.forEach(function (k) { k.checked = !every; });
    syncAll();
  });
  kids.forEach(function (k) { k.addEventListener('change', syncAll); });
  push.addEventListener('change', syncPush);
  root.addEventListener('change', saved);
  syncAll();
  syncPush();
})();
</script>
