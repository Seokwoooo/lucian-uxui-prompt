<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var q = function (s) { return root.querySelector(s); };
  var dz = q('.u432-dz'), ring = q('.u432-ring .pg'), nm = q('.u432-nm'), tag = q('.u432-doc .tg'), tagT = q('.u432-doc text'), file = q('.u432-file'), live = q('.u432-live');
  var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var T = { ok: '올렸어요', big: '10MB가 넘어요' };
  var COL = { pdf: '#E5484D', png: '#8E4EC6', jpg: '#0090FF', jpeg: '#0090FF', doc: '#2B63D9', docx: '#2B63D9', zip: '#C27A12' };
  var busy = false, raf = 0, timers = [];
  function later(fn, ms) { timers.push(setTimeout(function () { if (root.isConnected) fn(); }, ms)); }
  function size(b) { return b < 1048576 ? Math.max(1, Math.round(b / 1024)) + 'KB' : (b / 1048576).toFixed(1) + 'MB'; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  // 떨어진 문서 둘레의 고리가 차오르고, 다 차면 체크가 튀어나온 뒤 처음 모습으로 돌아갑니다
  function upload(f) {
    if (busy || !f) return;
    busy = true;
    var ext = (/\.([a-z0-9]+)$/i.exec(f.name) || [, 'file'])[1].toLowerCase();
    tag.style.setProperty('--c', COL[ext] || '#6B7280');
    tagT.textContent = ext.slice(0, 4).toUpperCase();
    root.classList.remove('is-done', 'is-out', 'is-err', 'is-drag');
    root.classList.add('is-up');
    ring.style.strokeDashoffset = 289;
    var tooBig = f.size > 10485760;
    nm.innerHTML = esc(f.name) + ' <small>· 0%</small>';
    var t0 = performance.now() + (rm ? 0 : 450), dur = rm ? 300 : 1500;
    cancelAnimationFrame(raf);
    (function step(now) {
      if (!root.isConnected) return;
      var k = Math.max(0, Math.min(1, (now - t0) / dur)), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      if (tooBig) e = Math.min(e, .18);
      ring.style.strokeDashoffset = (289 * (1 - e)).toFixed(1);
      nm.querySelector('small').textContent = '· ' + Math.round(e * 100) + '%';
      if (k < 1) { raf = requestAnimationFrame(step); return; }

      else { root.classList.add('is-done'); nm.querySelector('small').textContent = '· ' + size(f.size); live.textContent = f.name + ' ' + T.ok; }

        root.classList.add('is-out');
        later(function () { root.classList.remove('is-up', 'is-done', 'is-out', 'is-err'); busy = false; }, 350);
      }, rm ? 900 : 1700);
    })(performance.now());
  }
  dz.addEventListener('click', function (e) { if (!busy && e.target !== file) file.click(); });
  dz.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && !busy) { e.preventDefault(); file.click(); } });
  file.addEventListener('change', function () { upload(file.files[0]); file.value = ''; });
  var depth = 0;
  dz.addEventListener('dragenter', function (e) { e.preventDefault(); depth++; if (!busy) root.classList.add('is-drag'); });
  dz.addEventListener('dragover', function (e) { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy'; });
  dz.addEventListener('dragleave', function () { depth = Math.max(0, depth - 1); if (!depth) root.classList.remove('is-drag'); });

})();
</script>
