<script>

    ['zh', '简体中文', '中国大陆', 'Chinese Simplified', ['产品', '价格', '博客'], '你好'],
    ['zh-TW', '繁體中文', '台灣', 'Chinese Traditional Taiwan', ['產品', '價格', '部落格'], '你好'],
    ['es', 'Español', 'España', 'Spanish', ['Producto', 'Precios', 'Blog'], 'Hola'],
    ['fr', 'Français', 'France', 'French', ['Produit', 'Tarifs', 'Blog'], 'Bonjour'],
    ['de', 'Deutsch', 'Deutschland', 'German', ['Produkt', 'Preise', 'Blog'], 'Hallo'],

    ['th', 'ไทย', 'ประเทศไทย', 'Thai', ['ผลิตภัณฑ์', 'ราคา', 'บล็อก'], 'สวัสดี'],

  // 한국어 이름으로도 찾을 수 있게 하는 별칭(같은 순서)
  var KO = ['한국 한국어 코리아', '영어 미국', '영어 영국', '일본어 일본', '중국어 간체 중국', '중국어 번체 대만', '스페인어 스페인', '프랑스어 프랑스', '독일어 독일', '포르투갈어 브라질', '베트남어 베트남', '태국어 태국', '인도네시아어 인도네시아'];
  var CUR = 'ko';
  var btn = root.querySelector('.u448-btn'), curEl = root.querySelector('.u448-cur'), pop = root.querySelector('.u448-pop');
  var q = root.querySelector('.u448-q'), sb = root.querySelector('.u448-sb'), cnt = sb.querySelector('small'), ls = root.querySelector('.u448-ls'), empty = root.querySelector('.u448-empty');
  var nav = root.querySelector('.u448-nav'), hi = root.querySelector('.u448-hi'), live = root.querySelector('.u448-live');

    nav.innerHTML = ''; l[4].slice(0, 2).forEach(function (t) { var s = document.createElement('span'); s.textContent = t; nav.appendChild(s); });
    hi.textContent = l[5]; hi.style.animation = 'none'; void hi.offsetWidth; hi.style.animation = '';

  }
  // 목록: 자기 언어 이름·지역·영어 이름·한국어 별칭으로 찾습니다(악센트 무시). 맞는 부분을 강조합니다
  function draw() {
    var k = norm(q.value.trim());
    shown = L.filter(function (l, i) { return !k || norm([l[1], l[2], l[3], KO[i] || ''].join(' ')).indexOf(k) >= 0; });

      var b = li.querySelector('b'), n = norm(l[1]), at = k ? n.indexOf(k) : -1;
      if (at >= 0 && n.length === l[1].length) { b.appendChild(document.createTextNode(l[1].slice(0, at))); var m = document.createElement('mark'); m.textContent = l[1].slice(at, at + k.length); b.appendChild(m); b.appendChild(document.createTextNode(l[1].slice(at + k.length))); }

      li.querySelector('small').textContent = l[2];
      li.addEventListener('click', function () { choose(l[0]); });
      li.addEventListener('pointermove', function () { if (act !== i) setAct(i, false); });
      ls.appendChild(li);

    empty.hidden = shown.length > 0;
    cnt.textContent = k ? T.count(shown.length) : '';
    var sel = shown.findIndex(function (l) { return l[0] === CUR; });
    setAct(k ? 0 : Math.max(0, sel), true);
  }
  function setAct(i, scroll) {
    act = i;

    else if (e.key === 'ArrowUp') { e.preventDefault(); if (n) setAct((act - 1 + n) % n, true); }

  });

  page();
