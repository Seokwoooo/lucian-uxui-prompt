<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var q = function (s) { return root.querySelector(s); };
  var pg = q('.u436-pg'), ct = q('.u436-ct'), gone = q('.u436-gone'), open = q('.u436-open'), back = q('.u436-back'), ov = q('.u436-ov'), dlg = q('.u436-dlg'), no = q('.u436-no'), ok = q('.u436-ok'), live = q('.u436-live');
  var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var T = { del: '삭제', busy: '삭제하는 중…', done: '프로젝트를 삭제했어요' };
  var uid = 'u436' + Math.random().toString(36).slice(2, 7);
  dlg.querySelector('h3').id = uid + 't';
  dlg.querySelector('p').id = uid + 'd';
  dlg.setAttribute('aria-labelledby', uid + 't');
  dlg.setAttribute('aria-describedby', uid + 'd');
  var busy = false, lastFocus = null, timer = 0;
  ok.textContent = T.del;

  function isOpen() { return root.classList.contains('is-open'); }
  function setOpen(v, focus) {
    if (busy && !v) return;
    root.classList.toggle('is-open', v);
    // 창이 열려 있는 동안 뒤 화면은 누르거나 초점을 받을 수 없습니다
    if (v) pg.setAttribute('inert', ''); else pg.removeAttribute('inert');
    ov.setAttribute('aria-hidden', v ? 'false' : 'true');
    if (v) {
      if (focus) { lastFocus = document.activeElement; no.focus({ preventScroll: true }); }
    } else if (focus) {
      (lastFocus && lastFocus.isConnected && root.contains(lastFocus) ? lastFocus : open).focus({ preventScroll: true });
    }
  }
  function finish() {
    busy = false;
    ok.removeAttribute('aria-disabled'); no.removeAttribute('aria-disabled');
    ok.removeAttribute('aria-busy');
    ok.textContent = T.del;
    ct.hidden = true;
    gone.hidden = false;
    live.textContent = T.done;
    lastFocus = back;
    setOpen(false, document.activeElement && dlg.contains(document.activeElement));
  }
  open.addEventListener('click', function () { setOpen(true, true); lastFocus = open; });
  no.addEventListener('click', function () { setOpen(false, true); });
  // 삭제: 버튼이 진행 표시로 바뀌고, 그동안은 닫거나 다시 누를 수 없습니다(초점은 버튼에 그대로 둡니다)
  ok.addEventListener('click', function () {
    if (busy) return;
    busy = true;
    ok.setAttribute('aria-disabled', 'true'); no.setAttribute('aria-disabled', 'true');
    ok.setAttribute('aria-busy', 'true');
    ok.innerHTML = '<i class="u436-sp" aria-hidden="true"></i>';
    ok.appendChild(document.createTextNode(T.busy));
    live.textContent = T.busy;
    clearTimeout(timer);
    timer = setTimeout(function () { if (root.isConnected) finish(); }, rm ? 300 : 1500);
  });
  back.addEventListener('click', function () {
    gone.hidden = true;
    ct.hidden = false;
    open.focus({ preventScroll: true });
  });
  // 바깥(어두운 부분)을 누르면 닫습니다
  ov.addEventListener('click', function (e) { if (e.target === ov) setOpen(false, true); });
  root.addEventListener('keydown', function (e) {
    if (!isOpen()) return;
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); setOpen(false, true); return; }
    // 초점 가두기: Tab이 창 안의 버튼 사이에서만 돕니다
    if (e.key === 'Tab') {
      var f = dlg.querySelectorAll('button');
      if (!f.length) { e.preventDefault(); dlg.focus({ preventScroll: true }); return; }
      var first = f[0], last = f[f.length - 1], a = document.activeElement;
      if (e.shiftKey && (a === first || !dlg.contains(a))) { e.preventDefault(); last.focus({ preventScroll: true }); }
      else if (!e.shiftKey && (a === last || !dlg.contains(a))) { e.preventDefault(); first.focus({ preventScroll: true }); }
    }
  });
  // 처음 그릴 때는 열린 모습만 보여 주고, 초점은 옮기지 않습니다
  setOpen(true, false);
})();
</script>
