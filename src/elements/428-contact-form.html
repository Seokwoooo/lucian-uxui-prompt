    var er = root.querySelector('[data-er="' + k + '"]');
    er.innerHTML = msg ? ERI + '<span></span>' : '';
    if (msg) er.querySelector('span').textContent = msg;
    er.classList.toggle('is-on', !!msg);
    if (F[k]) { if (msg) F[k].setAttribute('aria-invalid', 'true'); else F[k].removeAttribute('aria-invalid'); }
  }
  function count() {
    var n = tx.value.length;
    ct.textContent = n + '/500';
    ct.classList.toggle('is-near', n >= 450);
  }
  [nm, em, tx].forEach(function (el) { el.addEventListener('input', function () { if (el.getAttribute('aria-invalid')) err(el === nm ? 'nm' : el === em ? 'em' : 'tx', ''); if (el === tx) count(); }); });
  cb.addEventListener('change', function () { if (cb.checked) err('cb', ''); });
  function size(b) { return b >= 1048576 ? (b / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(b / 1024)) + 'KB'; }
  // 첨부 파일은 칩으로 보여 주고 하나씩 지울 수 있습니다
  function drawFiles() {
    at.querySelectorAll('.u428-fc').forEach(function (c) { c.remove(); });
    q('.u428-hn').hidden = files.length > 0;
    files.forEach(function (f, i) {
      var c = document.createElement('span');
      c.className = 'u428-fc';
      var ext = (f.name.split('.').pop() || '').slice(0, 3).toUpperCase();
      c.innerHTML = '<i aria-hidden="true"></i><span></span><small></small><button type="button"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 2.5l5 5M7.5 2.5l-5 5"/></svg></button>';
      c.querySelector('i').textContent = ext;
      c.querySelector('span').textContent = f.name;
      c.querySelector('small').textContent = size(f.size);
      var x = c.querySelector('button');
      x.setAttribute('aria-label', '첨부 삭제: ' + f.name);
      x.addEventListener('click', function () { files.splice(i, 1); drawFiles(); fi.focus({ preventScroll: true }); });
      at.appendChild(c);
    });
  }
  fi.addEventListener('change', function () {
    var add = Array.prototype.slice.call(fi.files || []);
    var big = add.some(function (f) { return f.size > 10485760; });
    add = add.filter(function (f) { return f.size <= 10485760; });
    if (files.length + add.length > 3) { add = add.slice(0, 3 - files.length); err('fi', '파일은 3개까지 올릴 수 있어요'); }
    else err('fi', big ? '10MB 이하 파일만 올릴 수 있어요' : '');
    files = files.concat(add);
    fi.value = '';
    drawFiles();
  });
  // 보내기: 칸마다 확인하고, 처음 틀린 칸으로 초점을 옮깁니다
  fm.addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy) return;
    var bad = [];
    var n = nm.value.trim(), m = em.value.trim(), t = tx.value.trim();
    err('nm', n ? '' : '이름을 입력해 주세요'); if (!n) bad.push(nm);
    var em1 = !m ? '이메일을 입력해 주세요' : !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m) ? '이메일 형식을 확인해 주세요' : '';
    err('em', em1); if (em1) bad.push(em);
    err('tx', t.length >= 10 ? '' : '10자 이상 적어 주세요'); if (t.length < 10) bad.push(tx);
    err('cb', cb.checked ? '' : '개인정보 수집·이용에 동의해 주세요'); if (!cb.checked) bad.push(cb);
    if (bad.length) { bad[0].focus({ preventScroll: true }); return; }
    busy = true; go.setAttribute('aria-busy', 'true'); go.setAttribute('aria-label', '보내는 중…');
    setTimeout(function () {
      if (!root.isConnected) return;
      busy = false; go.removeAttribute('aria-busy'); go.removeAttribute('aria-label');
      q('.s-ty').textContent = TYPES[ty];
      q('.s-em').textContent = m;
      q('.s-fi').textContent = files.length ? files.length + '개' : '없음';
      root.classList.add('is-ok');
      q('.u428-fz').inert = true; nw.tabIndex = 0; nw.focus({ preventScroll: true });
    }, rm ? 200 : 1300);
  });
  nw.addEventListener('click', function () {
    fm.reset(); files = []; drawFiles(); count(); pick(0);
    ['nm', 'em', 'tx', 'cb', 'fi'].forEach(function (k) { err(k, ''); });
    root.classList.remove('is-ok'); q('.u428-fz').inert = false; nw.tabIndex = -1; nm.focus({ preventScroll: true });
  });
  q('.u428-cs a').addEventListener('click', function (e) { e.preventDefault(); });
  pick(0);
})();
</script>
