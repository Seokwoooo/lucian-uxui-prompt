<style>

<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var cd = root.querySelector('.u428-cd'), fm = root.querySelector('.u428-fm'), go = root.querySelector('.u428-go'), er = root.querySelector('.u428-er');
  var nm = root.querySelector('.u428-nm'), em = root.querySelector('.u428-em'), tx = root.querySelector('.u428-tx'), again = root.querySelector('.u428-again');
  var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var uid = 'u428-' + Math.random().toString(36).slice(2, 7);
  var timers = [], busy = false;
  [['nm', nm], ['em', em], ['tx', tx]].forEach(function (p) { p[1].id = uid + '-' + p[0]; root.querySelector('[data-for="' + p[0] + '"]').setAttribute('for', p[1].id); });
  function later(fn, ms) { timers.push(setTimeout(function () { if (root.isConnected) fn(); }, rm ? 0 : ms)); }
  fm.addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy) return;
    var bad = [];
    if (!nm.value.trim()) bad.push(nm);
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em.value.trim())) bad.push(em);
    if (tx.value.trim().length < 2) bad.push(tx);

      cd.classList.remove('is-bad'); void cd.offsetWidth; cd.classList.add('is-bad');
      bad[0].focus({ preventScroll: true });
      return;
    }

    busy = true;
    go.setAttribute('aria-busy', 'true'); go.setAttribute('aria-label', '보내는 중…');
    // 지금 크기를 고정한 뒤 봉투 크기로 줄여야 부드럽게 접힙니다
    later(function () {
      cd.style.width = cd.offsetWidth + 'px'; cd.style.height = cd.offsetHeight + 'px';
      void cd.offsetWidth;
      cd.classList.add('is-fold');
      fm.inert = true;
    }, 450);
    later(function () { cd.classList.add('is-fly'); }, 1900);
    later(function () { root.classList.add('is-sent'); again.tabIndex = 0; again.focus({ preventScroll: true }); }, 2550);
  });
  [nm, em, tx].forEach(function (el) { el.addEventListener('input', function () { if (el.getAttribute('aria-invalid')) { el.removeAttribute('aria-invalid'); if (!root.querySelector('[aria-invalid]')) er.textContent = ''; } }); });

    root.classList.remove('is-sent');
    cd.classList.remove('is-fold', 'is-fly', 'is-bad');

    go.removeAttribute('aria-busy'); go.removeAttribute('aria-label');

    nm.focus({ preventScroll: true });
  });
})();
</script>
