    win.style.setProperty('--rx', (-y * 5).toFixed(2) + 'deg');
  });
  shot.addEventListener('pointerleave', function () { win.classList.remove('is-live'); win.style.setProperty('--ry', '0deg'); win.style.setProperty('--rx', '0deg'); });
  root.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', function (e) { e.preventDefault(); }); });
})();
</script>
