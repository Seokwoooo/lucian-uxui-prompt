<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var h1 = root.querySelector('h1');
  // 두 줄을 단어로 나눠, 단어마다 가림막 안에서 솟아오르게 합니다
  var lines = [h1.getAttribute('data-l1'), h1.getAttribute('data-l2')], k = 0;
  h1.setAttribute('aria-label', lines.join(' '));
  lines.forEach(function (line, li) {
    var ln = document.createElement('span');
    ln.className = 'ln'; ln.setAttribute('aria-hidden', 'true');
    var words = line.split(' ');
    words.forEach(function (w, wi) {
      var o = document.createElement('span');
      o.className = 'u419-w' + (li === 1 && wi === words.length - 1 ? ' gr' : '');
      var s = document.createElement('span');
      s.textContent = w; s.style.setProperty('--i', k++);
      o.appendChild(s); ln.appendChild(o);
      if (wi < words.length - 1) ln.appendChild(document.createTextNode(' '));
    });
    h1.appendChild(ln);
  });
  root.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', function (e) { e.preventDefault(); }); });
})();
</script>
