<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var bn = root.querySelector('.u425-bn'), go = root.querySelector('.u425-go'), fm = root.querySelector('.u425-fm');
  var inp = root.querySelector('.u425-in'), ok = root.querySelector('.u425-ok'), x = root.querySelector('.u425-x');
  var tr = root.querySelector('.u425-tr'), done = root.querySelector('.u425-done small');
  var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var uid = 'u425-' + Math.random().toString(36).slice(2, 7);
  var trust = tr.textContent, busy = false;
  inp.id = uid + '-e'; fm.querySelector('label').setAttribute('for', inp.id);
  tr.id = uid + '-t'; inp.setAttribute('aria-describedby', tr.id);
  // 포인터를 따라 배너 위의 빛이 움직입니다
  bn.addEventListener('pointermove', function (e) {
    var r = bn.getBoundingClientRect();
    bn.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%');
    bn.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%');
  });

  function mode(m) {
    root.classList.toggle('is-fm', m === 'fm');
    root.classList.toggle('is-done', m === 'done');
    [inp, ok, x].forEach(function (el) { tab(el, m === 'fm'); });
    tab(go, m === 'btn'); tab(root.querySelector('.u425-sl'), m === 'btn');
    if (m !== 'fm') err('');
    if (m === 'fm') inp.focus({ preventScroll: true });
    if (m === 'btn') go.focus({ preventScroll: true });

  go.addEventListener('click', function () { mode('fm'); });
  x.addEventListener('click', function () { mode('btn'); });
  fm.addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy) return;
    var v = inp.value.trim();
