<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var hs = root.querySelectorAll('.u440-h b'), go = root.querySelector('.u440-go'), live = root.querySelector('.u440-live');
  var T = { empty: '아직 프로젝트가 없어요', done: '첫 프로젝트가 생겼어요', create: '첫 프로젝트 만들기', open: '하나 더 만들기' };
  var PLUS = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
  hs[0].textContent = T.empty; hs[1].textContent = T.done;
  var done = false;
  function sync() {
    root.classList.toggle('is-done', done);
    hs[0].setAttribute('aria-hidden', done ? 'true' : 'false'); hs[1].setAttribute('aria-hidden', done ? 'false' : 'true');
    go.innerHTML = PLUS + '<span>' + (done ? T.open : T.create) + '</span>';
  }
  // 만들 때마다 문서가 폴더에 떨어집니다(다시 누르면 한 장 더)
  go.addEventListener('click', function () {
    if (done) { root.classList.remove('is-done'); void root.offsetWidth; }
    done = true;
    sync();
    live.textContent = T.done;
  });
  sync();
})();
</script>
