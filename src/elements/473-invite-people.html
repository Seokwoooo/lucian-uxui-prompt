      }, rm ? 0 : k * 120 + 60);
      later(function () { resize(function () { it.el.remove(); }); }, rm ? 0 : k * 120 + 460);
    });
  }
  function finish(n, slots) {
    go.classList.add('is-ok');
    live.textContent = n + T.sent;
    later(function () { slots.forEach(function (s) { s.classList.add('is-calm'); }); }, 1700);
    later(function () {
      slots.forEach(function (s) { s.classList.remove('u473-new', 'is-in', 'is-calm'); var b = s.querySelector('.u473-ok'); if (b) b.remove(); });
      trim();
      go.classList.remove('is-ok');
      busy = false; sync();
    }, 2300);
  }
  sync();
})();
</script>
