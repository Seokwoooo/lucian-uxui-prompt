<style>

.u458-b{transition:transform .5s cubic-bezier(.34,1.6,.5,1)}

.u458-rp{inset:0;opacity:0;transition:opacity .6s var(--ux-ease)}
.u458-rp i{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 1.5px rgba(123,97,255,.5);box-shadow:0 0 0 1.5px light-dark(rgba(106,87,242,.45),rgba(183,164,255,.55));opacity:0;animation:u458-rip 2.4s cubic-bezier(.2,.6,.35,1) infinite}

.u458-o{inset:0;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 50% 38%,#8C78FF,#5A43EA 56%,#33209E);box-shadow:inset 0 -12px 26px rgba(18,6,80,.5),inset 0 8px 16px rgba(255,255,255,.28),0 22px 40px -18px rgba(70,46,210,.75);will-change:transform}
.u458-o i{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px;border-radius:50%;filter:blur(14px);opacity:.82;will-change:transform}

.u458-o b{position:absolute;left:17%;top:7%;width:54%;height:34%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.7),rgba(255,255,255,0));pointer-events:none}

<div class="ux u458" data-s="idle">
  <button type="button" class="u458-b" aria-label="음성 비서">
    <span class="u458-gw" aria-hidden="true"></span>
    <span class="u458-rp" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="u458-o" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></span>
  </button>
  <p class="u458-st" role="status"><span>탭해서 말하기</span></p>
</div>
<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var b = root.querySelector('.u458-b'), gw = root.querySelector('.u458-gw'), orb = root.querySelector('.u458-o'), st = root.querySelector('.u458-st');
  var blobs = [].slice.call(orb.querySelectorAll('i'));
  var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var uid = 'u458' + Math.random().toString(36).slice(2, 7);
  st.id = uid;
  b.setAttribute('aria-describedby', uid);
  var T = { idle: '탭해서 말하기', listen: '듣고 있어요', think: '생각하는 중', speak: '말하는 중' };
  var ORDER = ['idle', 'listen', 'think', 'speak'];
  // 상태마다 목표값: 소용돌이 속도(sp), 숨(br), 맥박(pu), 기본 크기(base), 빛(gl), 빛 덩어리 궤도 반지름(rr)
  var P = {
    idle: { sp: 0.35, br: 0.03, pu: 0, base: 1, gl: 0.62, rr: 27 },
    listen: { sp: 0.8, br: 0.012, pu: 0.03, base: 1.05, gl: 0.9, rr: 29 },
    think: { sp: 3.4, br: 0.008, pu: 0, base: 0.9, gl: 0.5, rr: 36 },
    speak: { sp: 1.1, br: 0, pu: 0.11, base: 1, gl: 0.95, rr: 28 }
  };
  var state = 'idle', cur = {}, ang = 0, last = 0;
  for (var k in P.idle) cur[k] = P.idle[k];
  // 모든 움직임은 한 루프에서 목표값을 향해 부드럽게 따라가므로, 상태를 바꿔도 움직임이 끊기지 않습니다
  function draw(t, dt) {
    var tg = P[state], f = rm ? 1 : 1 - Math.exp(-dt * 3);
    for (var k in tg) cur[k] += (tg[k] - cur[k]) * f;
    ang += cur.sp * dt;
    var breathe = Math.sin(t * 1.7) * cur.br;
    var env = Math.max(0, Math.sin(t * 9.4)) * (0.55 + 0.45 * Math.sin(t * 2.3 + 0.7));
    var hum = Math.max(0, Math.sin(t * 6.1) * Math.sin(t * 1.9));
    var pulse = cur.pu * (state === 'listen' ? hum : env);
    var s = cur.base + breathe + pulse;
    orb.style.transform = 'scale(' + s.toFixed(4) + ')';
    gw.style.opacity = Math.min(1, cur.gl + pulse * 2.4).toFixed(3);
    gw.style.transform = 'scale(' + (s + pulse * 1.6 + breathe).toFixed(4) + ')';
    blobs.forEach(function (el, i) {
      var a = ang * (1 + i * 0.22) + i * Math.PI / 2;
      var r = cur.rr + Math.sin(t * 0.9 + i * 1.4) * 6;
      var sc = 1 + 0.16 * Math.sin(t * 1.3 + i * 1.7);
      el.style.transform = 'translate(' + (Math.cos(a) * r).toFixed(2) + 'px,' + (Math.sin(a) * r).toFixed(2) + 'px) scale(' + sc.toFixed(3) + ')';
    });
  }
  function frame(now) {
    if (!root.isConnected) return;
    var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
    last = now;
    draw(now / 1000, dt);
    requestAnimationFrame(frame);
  }
  function label(s) {
    var old = st.querySelector('span:last-child'), n = document.createElement('span');
    n.textContent = T[s];
    st.appendChild(n);
    if (rm || !n.animate) { if (old) old.remove(); return; }
    n.animate([{ opacity: 0, transform: 'translateY(6px)', filter: 'blur(3px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], { duration: 380, easing: 'cubic-bezier(.3,1.3,.5,1)' });
    if (old) old.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-6px)', filter: 'blur(3px)' }], { duration: 220, easing: 'ease-in', fill: 'forwards' }).onfinish = function () { old.remove(); };
  }
  function set(s) {
    state = s;
    root.dataset.s = s;
    label(s);
    if (rm) draw(performance.now() / 1000, 1);
    if (!rm && orb.animate) orb.animate([{ filter: 'brightness(1.25)' }, { filter: 'brightness(1)' }], { duration: 420, easing: 'ease-out' });
  }
  b.addEventListener('click', function () { set(ORDER[(ORDER.indexOf(state) + 1) % ORDER.length]); });
  root.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state !== 'idle') { e.preventDefault(); e.stopPropagation(); set('idle'); }
  });
  if (rm) draw(0, 1); else requestAnimationFrame(frame);
})();
</script>
