<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var card = root.querySelector('.u439-c'), rl = root.querySelector('.u439-rl'), live = root.querySelector('.u439-live');
  var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var T = { loading: '불러오는 중', done: '불러왔어요' };
  var timer = 0;
  // 뼈대를 보여 주다가, 내용이 오면 그림 → 제목 → 글쓴이 순서로 겹쳐 나타납니다
  function load() {
    clearTimeout(timer);
    root.classList.add('is-loading');
    card.setAttribute('aria-busy', 'true');
    live.textContent = T.loading;
    timer = setTimeout(function () {
      if (!root.isConnected) return;
      root.classList.remove('is-loading');
      card.setAttribute('aria-busy', 'false');
      live.textContent = T.done;
    }, rm ? 500 : 1500);
  }
  rl.addEventListener('click', load);
  load();
})();
</script>
