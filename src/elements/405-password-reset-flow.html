    panes.forEach(function (p, k) { p.classList.toggle('is-cur', k === n); p.classList.toggle('is-left', k < n); p.inert = k !== n; });
    steps[0].className = n < 2 ? 'is-cur' : 'is-done';
    steps[1].className = n === 2 ? 'is-cur' : n === 3 ? 'is-done' : '';
    if (n < 2) steps[0].setAttribute('aria-current', 'step'); else steps[0].removeAttribute('aria-current');
    if (n === 2) steps[1].setAttribute('aria-current', 'step'); else steps[1].removeAttribute('aria-current');
    var f = focusSel && panes[n].querySelector(focusSel);
    if (f) later(function () { f.focus({ preventScroll: true }); }, rm ? 0 : 360);
  }
  // 입력칸 강조: 실제 초점과 함께, 칸을 누른 순간에도 켭니다
  root.addEventListener('pointerdown', function (e) { bxs.forEach(function (b) { b.classList.toggle('is-f', b.contains(e.target) && !eye.contains(e.target)); }); });
  ins.forEach(function (i, k) { i.addEventListener('blur', function () { bxs[k].classList.remove('is-f'); }); });
  // 다시 보내기 쿨다운: 1초마다 줄고, 요소가 화면에서 빠지면 멈춥니다
  function cool() {
    clearInterval(tick); left = 30;
    re.disabled = true; re.textContent = T.wait(left);
    tick = setInterval(function () {
      if (!root.isConnected) { clearInterval(tick); return; }
      left -= 1;
      if (left <= 0) { clearInterval(tick); re.disabled = false; re.textContent = T.again; }
      else re.textContent = T.wait(left);
    }, 1000);
  }
  function arrive() {
    nt.classList.remove('is-on'); nt.tabIndex = -1;
    later(function () { nt.classList.add('is-on'); nt.tabIndex = 0; }, rm ? 0 : 900);
  }
  em.addEventListener('input', function () { bxs[0].classList.remove('is-err'); em.removeAttribute('aria-invalid'); });
  panes[0].addEventListener('submit', function (e) {
    e.preventDefault();
    var v = em.value.trim();
    if (!MAIL.test(v)) { bxs[0].classList.add('is-err'); em.setAttribute('aria-invalid', 'true'); live.textContent = T.bad; em.focus(); return; }
    if (send.classList.contains('is-busy')) return;
    send.classList.add('is-busy'); send.setAttribute('aria-busy', 'true'); bxs[0].classList.remove('is-f');
    later(function () {
      send.classList.remove('is-busy'); send.removeAttribute('aria-busy');
      to.textContent = v; live.textContent = T.sent;
      go(1, '.u405-edit'); cool(); arrive();
    }, rm ? 200 : 800);
  });
  re.addEventListener('click', function () { live.textContent = T.resent; cool(); arrive(); });
  root.querySelector('.u405-edit').addEventListener('click', function () { clearInterval(tick); nt.classList.remove('is-on'); go(0, '.u405-in'); });
  root.querySelector('.u405-lk').addEventListener('click', function () { em.value = ''; bxs[0].classList.remove('is-err'); });
  nt.addEventListener('click', function () { clearInterval(tick); go(2, '.u405-in'); });
  // 새 비밀번호: 규칙과 일치 여부를 한 줄 안내로 보여 주고, 둘 다 맞아야 변경 버튼이 켜집니다
  function strong(v) { return v.length >= 8 && /\d/.test(v) && /[^A-Za-z0-9\s]/.test(v); }
  function check(final) {
    var a = pw.value, b = cf.value, good = strong(a), same = !!b && a === b, wrong = !!b && (final ? a !== b : a.indexOf(b) !== 0);
    bxs[2].classList.toggle('is-ok', same && good);
    bxs[2].classList.toggle('is-err', wrong);
    var text = wrong ? T.diff : (a && !good) ? T.weak : same ? T.same : '';
    msg.textContent = text;
    msg.classList.toggle('is-on', !!text);
    msg.classList.toggle('is-good', !wrong && good && same);
    msg.classList.toggle('is-soft', !wrong && !!a && !good);
    if (wrong) cf.setAttribute('aria-invalid', 'true'); else cf.removeAttribute('aria-invalid');
    chg.disabled = !(good && same);
  }
  pw.addEventListener('input', function () { check(false); });
  cf.addEventListener('input', function () { check(false); });
  cf.addEventListener('blur', function () { if (cf.value) check(true); });
  eye.addEventListener('click', function () {
    var show = eye.getAttribute('aria-pressed') !== 'true';
    eye.setAttribute('aria-pressed', String(show));
    pw.type = show ? 'text' : 'password';
  });
  panes[2].addEventListener('submit', function (e) {
    e.preventDefault();
    if (chg.disabled || chg.classList.contains('is-busy')) return;
    chg.classList.add('is-busy'); chg.setAttribute('aria-busy', 'true'); bxs.forEach(function (b) { b.classList.remove('is-f'); });
    later(function () {
      chg.classList.remove('is-busy'); chg.removeAttribute('aria-busy');
      live.textContent = T.changed;
      go(3, '.u405-home');
    }, rm ? 200 : 900);
  });
  // 처음으로: 입력과 타이머를 모두 비웁니다
  root.querySelector('.u405-home').addEventListener('click', function () {
    gen += 1; clearInterval(tick);
    [em, pw, cf].forEach(function (i) { i.value = ''; i.removeAttribute('aria-invalid'); });
    bxs.forEach(function (b) { b.classList.remove('is-ok', 'is-err'); });
    pw.type = 'password'; eye.setAttribute('aria-pressed', 'false');
    nt.classList.remove('is-on'); check(false); msg.classList.remove('is-on');
    go(0, '.u405-in');
  });
  go(0);
})();
</script>
